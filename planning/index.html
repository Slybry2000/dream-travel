<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta name="description" content="Plan a private group journey with Dream Travel.">
  <title>Plan your group trip | Dream Travel</title>
  <style>
    html, body { height: 100%; margin: 0; background: #f5f7fb; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .fallback { box-sizing: border-box; max-width: 42rem; margin: 0 auto; padding: 3rem 1.5rem; font: 1rem/1.6 system-ui, sans-serif; color: #0b2131; }
    .fallback a { color: #4256d6; font-weight: 700; }
  </style>
</head>
<body>
  <iframe id="planner"
    title="Dream Travel group trip planner"
    allow="clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script src="../journey-path.js?v=2" data-page="planning"></script>
  <script>
    const planner = document.getElementById('planner');
    const destination = new URL('https://dream-travel-planner.perseidechocreations.workers.dev/');
    destination.search = location.search;
    if (window.dtJourneyParams) {
      const route = window.dtJourneyParams();
      Object.keys(route).forEach((k) => { if (!destination.searchParams.get(k)) destination.searchParams.set(k, route[k]); });
    }
    planner.src = destination.toString();
  </script>
  <noscript>
    <p class="fallback">JavaScript is required for the planner. <a href="https://dream-travel-planner.perseidechocreations.workers.dev/">Open the Dream Travel planner</a>.</p>
  </noscript>
</body>
</html>
